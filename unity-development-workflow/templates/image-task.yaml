            productionMethod: UNITY_NATIVE
            deliveryKind: UNITY_COMPONENT
            finalOwner: RUNTIME_RENDERED
          assemblyAnalysis: {strategy: STRUCTURED_UNITY_ASSEMBLY, unityAssetType: PREFAB, nodeId: node.player-selection-glow, parentNodeId: node.player-select-root, layoutSystem: TRANSFORM, fullScreenCapture: false, evidence: {type: assembly-analysis, path: Artifacts/Visual/Assembly/player-selection-glow.yaml}}
