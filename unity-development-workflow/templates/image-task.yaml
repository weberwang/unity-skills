            fullScreenCapture: false
            nativeSuitability: {eligible: true, primitiveBasis: [BASIC_GEOMETRY, SHADER], reason: 规则光晕由已确认的程序绘制边界实现。, evidence: {type: visual-route-analysis, path: Artifacts/Visual/Routes/player-selection-glow.yaml}}
