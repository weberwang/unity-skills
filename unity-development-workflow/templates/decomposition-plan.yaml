      - ISceneLoader
    sceneConsumers:
      - scene.arena-intro
      - scene.arena-battle
    decision: SPLIT
    rationale: 多场景消费且生命周期独立
  - id: Gameplay.Player
    category: Gameplay
    responsibility: 实现玩家移动、输入解释与交互规则
