    impact: 决定模块、场景、美术资源和测试范围，错误假设会导致整体返工。
    options:
      - id: option.single-player
        label: 单机核心循环（推荐）
        impact: 最早形成可验收闭环，联网和扩展内容明确列为非目标。
      - id: option.online-foundation
        label: 同步搭建联网基础
        impact: 扩大架构、测试和交付范围，并延后首个可玩版本。
    recommendation: option.single-player
    rationale: 最小闭环可最早验证玩法价值，并降低架构和资源并行开发的浪费。
